<!doctype html><meta charset="utf-8">
<!--
  Engraving page for Mod/About/Preview.png, per STYLE_RIMWORLD.md.

  Rasterised with headless Chrome at 896x504, so the glyphs are composed at final size and never
  resampled. The background is Preview-source.png at full resolution, scaled here rather than
  beforehand: starting from an already-reduced Preview.png would resample the picture twice.

    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless --disable-gpu \
      --hide-scrollbars --window-size=896,504 --screenshot=Mod/About/Preview.png Art/preview.html

  The source is 1374x1145, close to 6:5, so the crop is the whole problem. Fitting 896x504 keeps
  the full width and 773 source rows out of 1145, and the scene occupies 859 of them: from the
  walking settler at 3% down to the food bowl at 78%. Something has to go. Clipping the settler
  leaves a headless figure and clipping the sloth mutilates the subject, so the crop starts just
  below the settler's feet and drops him entirely. The cost is the second vivid note, his red
  coat: the lamp pool now carries the colour alone, which the style allows - two is a ceiling,
  not a quota.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           font-family:"Segoe UI",system-ui,sans-serif; }

  /* Full width, vertical crop, anchored near the bottom of the croppable band: the visible rows
     run from just under the settler's feet down to the empty floor below the bowl. */
  .shot { position:absolute; inset:0; width:896px; height:504px;
          object-fit:cover; object-position:50% 86%; }

  /* Repository standard: radial darkening from the top-left, nil at 74%. The scene's own lamp
     pool sits low and right, so the title lands on floor that was already the darkest thing. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(circle at 0% 0%, rgba(6,5,4,.86) 0%, rgba(6,5,4,0) 74%); }

  .text { position:absolute; left:56px; top:104px; width:430px; }
  h1 { font-size:48px; line-height:1.04; font-weight:700; color:#f2ece1;
       letter-spacing:-.5px; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .rule { width:58px; height:3px; background:#D68F2C; margin:22px 0 20px; }
  p { font-size:21px; line-height:1.42; color:#d8cfc0; text-shadow:0 1px 6px rgba(0,0,0,.75); }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png">
  <div class="veil"></div>
  <div class="text">
    <h1>A Sloth Mod<br>Renew</h1>
    <div class="rule"></div>
    <p>One slow, harmless animal, brought forward to 1.6.</p>
  </div>
</div>
