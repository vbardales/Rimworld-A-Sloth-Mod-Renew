<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sloth preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,.stage{width:896px;height:504px;overflow:hidden}
.stage{position:relative;font-family:"Segoe UI",system-ui,sans-serif}
.shot{position:absolute;inset:0;width:896px;height:504px;object-fit:cover;object-position:50% 86%}
.veil{position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,rgb(var(--veilRGB) / .86) 0%,rgb(var(--veilRGB) / 0) 74%)}
.text{position:absolute;left:50px;top:54px;color:var(--inkPrimary);text-shadow:0 3px 10px rgba(0,0,0,.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0}
h1 .link,h1 .suffix{font-size:.65em}
h1 .suffix{color:var(--inkSecondary)}
.tag{margin-top:8px;font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;color:var(--inkSecondary)}
.rule{width:58px;height:3px;margin:20px 0 16px;background:var(--accent)}
p{width:430px;font-size:21px;font-weight:400;line-height:1.45;letter-spacing:0}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);color:var(--badgeInk);font-size:26px;font-weight:700;line-height:1}
</style></head><body><div class="stage">
<img class="shot" src="Preview.png" alt=""><div class="veil"></div>
<div class="text"><h1><span class="link">A</span> Sloth Mod<br><span class="suffix">Renew</span></h1><div class="tag">(unofficial)</div><div class="rule"></div><p>One slow, harmless animal, brought forward.</p></div>
<div class="badge"></div><div class="version"></div>
</div><script>
window.previewReady=(async()=>{
const palette=await(await fetch('preview-palette.json')).json();
for(const [key,value] of Object.entries(palette))document.documentElement.style.setProperty('--'+key,value);
document.documentElement.style.setProperty('--veilRGB',palette.veil.match(/\w\w/g).map(x=>parseInt(x,16)).join(' '));
const xml=new DOMParser().parseFromString(await(await fetch('../Mod/About/About.xml')).text(),'application/xml');
const versions=[...xml.querySelectorAll('supportedVersions li')].map(x=>x.textContent.trim()).filter(x=>/^\d+\.\d+(\.\d+)?$/.test(x));
versions.sort((a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d;}return 0;});
if(!versions.length)throw Error('No stable supported version');
document.querySelector('.version').textContent=versions.at(-1);
await document.fonts.ready;await document.querySelector('.shot').decode();
})();
</script></body></html>
